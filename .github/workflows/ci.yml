name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install mise and tools
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: false

      - name: Run CI
        run: make ci
